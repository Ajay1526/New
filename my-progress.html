<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Progress</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;font-size:13px}
body{margin:0;background:#f0f0f0;color:#333}
.top{background:#2b2b2b;color:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.top a{color:#ffcc00;margin-left:10px}
.wrap{max-width:1000px;margin:15px auto;padding:0 10px}
.card{background:#fff;border:1px solid #ccc;padding:12px;margin-bottom:12px;border-radius:4px;overflow-x:auto}
h3{margin:0 0 8px;color:#31708f}
h2{margin:6px 0 10px;font-size:16px;color:#31708f}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.k{background:#e8f0f8;padding:10px;text-align:center;border-radius:4px;border:1px solid #d0e1f9}
.k .l{font-size:12px;color:#444}
.k b{display:block;font-size:18px;margin-top:4px}
.k .s{display:block;font-size:11px;color:#555;margin-top:3px;border-top:1px dashed #bcdff5;padding-top:3px}
.best{border:2px solid #f0ad4e}
.badge{display:inline-block;background:#f0ad4e;color:#fff;font-weight:bold;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px}
.head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.head .nm{font-size:15px;font-weight:bold;color:#31708f}
.head .dt{font-size:12px;color:#666;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:#e8f0f8;border:1px solid #d0e1f9;border-radius:4px;padding:5px 10px;text-align:center}
.chip span{display:block;font-size:11px;color:#555}
.chip b{font-size:14px}
table{width:100%;border-collapse:collapse}
th{background:#c6d9f1;border:1px solid #8ea9db;padding:6px}
td{border:1px solid #ccc;padding:6px;text-align:center}
.c{color:#2e7d32;font-weight:bold}.w{color:#d9534f;font-weight:bold}.u{color:#888;font-weight:bold}
button,.btn{padding:6px 12px;border:1px solid #bbb;background:#fff;cursor:pointer;border-radius:3px;text-decoration:none;color:#333;display:inline-block}
.btn.p{background:#33a6ea;color:#fff;border:0}
.btn.g{background:#2e7d32;color:#fff;border:0}
details summary{cursor:pointer;font-weight:bold;color:#31708f;margin-bottom:8px}
.bm{border:1px solid #ffe082;background:#fffde7;border-radius:4px;padding:10px;margin-bottom:8px}
.bm .t{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.bm .o{padding:3px 6px;border-radius:3px;margin:3px 0}
.bm .o.ok{background:#d4edda}.bm .o.bad{background:#f8d7da}
.bm summary{font-weight:normal}
.up{color:#2e7d32;font-weight:bold}.dn{color:#d9534f;font-weight:bold}
.bar{height:8px;border-radius:4px;background:#33a6ea;min-width:2px}
.gh{margin:10px 0 6px;font-weight:bold;color:#31708f;font-size:14px}
.empty{text-align:center;padding:20px;color:#666}
</style></head><body>
<div class="top">
  <b>📈 My Progress</b>
  <span>
    <a href="bookmarks.html">🔖 Bookmarks</a>
    <a href="result.html">Result Analysis</a>
    <a href="home.html">🏠 Home</a>
  </span>
</div>
<div class="wrap" id="root"></div>

<div id="reModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9999;justify-content:center;align-items:center">
  <div style="background:#fff;padding:20px;border-radius:6px;width:300px;text-align:center;box-shadow:0 4px 8px rgba(0,0,0,.2)">
    <h4 style="margin:0 0 10px;font-size:15px">Re-attempt Test</h4>
    <div id="reInfo" style="margin:0 0 10px;padding:8px;background:#e8f0f8;border-radius:4px;text-align:left;font-size:12px;line-height:1.6"></div>
    <p style="margin:0 0 20px;color:#555">क्या आप यह टेस्ट दोबारा देना चाहते हैं? आपके पिछले attempts यहाँ सुरक्षित रहेंगे।</p>
    <div style="display:flex;justify-content:space-around">
      <button onclick="closeRe()" style="background:#ccc;border:0;font-weight:bold">Cancel</button>
      <button onclick="goRe()" style="background:#2e7d32;color:#fff;border:0;font-weight:bold">Yes, Re-attempt</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let A=[];
try{A=JSON.parse(localStorage.getItem('examAttempts'))||[]}catch(e){}
A=A.filter(a=>a&&Array.isArray(a.sections));
let D=null;try{D=JSON.parse(localStorage.getItem('examData'))}catch(e){}
let BMX=[];try{BMX=JSON.parse(localStorage.getItem('examBookmarks'))||[]}catch(e){}
const sum=a=>a.reduce((x,y)=>x+y,0);
const fmt=s=>{s=Math.round(s||0);return Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s'};
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const r2=n=>Math.round(n*100)/100;

function secStats(s){
  let c=0,w=0,u=0,cT=0,wT=0,tot=0;
  (s.q||[]).forEach(x=>{
    const t=x.t||0; tot+=t;
    if(x.a<0)u++;
    else if(x.a===x.c){c++;cT+=t}
    else{w++;wT+=t}
  });
  const att=c+w;
  return {c,w,u,cT,wT,tot,att,acc:att?c/att*100:0,net:r2(c-w*0.25)};
}
function stats(a){
  const parts=a.sections.map(secStats);
  const o={c:0,w:0,u:0,cT:0,wT:0,tot:0,att:0};
  parts.forEach(p=>['c','w','u','cT','wT','tot','att'].forEach(k=>o[k]+=p[k]));
  o.acc=o.att?o.c/o.att*100:0;
  o.net=r2(o.c-o.w*0.25);
  o.parts=parts;
  return o;
}
function score(a){return (typeof a.score==='number')?a.score:stats(a).net}
function when(a){
  const idn=Number(a.id);
  const d=(idn>1e11)?new Date(idn):null;
  if(a.date&&a.time) return esc(a.date)+' • '+esc(a.time);
  if(d&&!isNaN(d)){
    return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+' • '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  }
  return esc(a.date||'—');
}

const tname=a=>a.testName||'Test';
// index.html में "Mark for Review" ही bookmark है: status 3 = Marked, 4 = Answered & Marked
function isBm(x,i,j,sec){
  const sv=sec&&Array.isArray(sec.status)?sec.status[j]:0;
  if(sv===3||sv===4)return true;
  if(x&&(x.b||x.bm||x.bookmark||x.bookmarked||x.isBookmarked||x.saved))return true;
  return Array.isArray(BMX)&&BMX.some(m=>m&&Number(m.s)===i&&Number(m.q)===j);
}
const L=n=>String.fromCharCode(65+n);
function bmHTML(){
  let B=[];try{B=JSON.parse(localStorage.getItem('examBookmarks'))||[]}catch(e){}
  const subs=new Set(B.map(b=>b.subject)).size, dates=new Set(B.map(b=>b.date)).size;
  return `<div class="card"><div class="head" style="margin-bottom:0"><h2 style="margin:0">🔖 Saved Bookmarks (${B.length})</h2><div><a class="btn p" href="bookmarks.html">Open Bookmarks →</a>${B.length?' <a class="btn g" href="index.html?mode=bookmarks">▶ Practice</a>':''}</div></div>${B.length?`<div style="font-size:12px;color:#666;margin-top:6px">${subs} subject(s) • ${dates} date(s)</div>`:'<div class="empty" style="padding:8px">अभी कोई bookmark नहीं है। टेस्ट में प्रश्न पर "☆ Bookmark" दबाएँ।</div>'}</div>`;
}

function prevIdx(n){
  for(let k=n-1;k>=0;k--) if(tname(A[k])===tname(A[n])) return k;
  return -1;
}
function delta(d){
  d=r2(d);
  if(d>0)return `<span class="up">▲ +${d}</span>`;
  if(d<0)return `<span class="dn">▼ ${d}</span>`;
  return '<span class="u">＝ 0</span>';
}
function cmpHTML(S,scores){
  const groups={};
  A.forEach((a,n)=>{(groups[tname(a)]=groups[tname(a)]||[]).push(n)});
  const multi=Object.keys(groups).filter(k=>groups[k].length>1);
  let o='<div class="card"><h2 style="margin-top:0">🔁 Attempt-wise Comparison (Re-attempts)</h2>';
  if(!multi.length){
    return o+'<div class="empty" style="padding:10px">किसी टेस्ट को दोबारा attempt करने पर Attempt 1, Attempt 2 … की तुलना यहाँ दिखेगी।</div></div>';
  }
  multi.forEach(name=>{
    const idxs=groups[name];
    const mx=Math.max(...idxs.map(n=>Math.abs(scores[n])),1);
    o+=`<div class="gh">${esc(name)}</div><table><tr><th>Attempt</th><th>Submitted</th><th>Score</th><th>Change</th><th>Accuracy</th><th>Correct</th><th>Wrong</th><th>Unattempted</th><th>Total Time</th><th style="min-width:90px">Score Bar</th></tr>`;
    idxs.forEach((n,k)=>{
      const st=S[n];
      const ch=k===0?'<span class="u">—</span>':delta(scores[n]-scores[idxs[k-1]]);
      o+=`<tr><td><b>Attempt ${k+1}</b></td><td>${when(A[n])}</td><td><b>${scores[n]}</b></td><td>${ch}</td><td>${st.acc.toFixed(1)}%</td><td class="c">${st.c}</td><td class="w">${st.w}</td><td class="u">${st.u}</td><td>${fmt(st.tot)}</td><td style="text-align:left"><div class="bar" style="width:${Math.max(2,Math.abs(scores[n])/mx*100)}%"></div></td></tr>`;
    });
    o+='</table>';
  });
  return o+'</div>';
}

function render(){
  const root=$('root');
  if(!A.length){
    root.innerHTML='<div class="card empty">अभी तक कोई टेस्ट attempt नहीं किया गया है।<br><br><a class="btn p" href="home.html">Start a Test</a></div>';
    return;
  }
  const S=A.map(stats);
  const scores=A.map(score);
  const bestIdx=scores.indexOf(Math.max(...scores));
  const best=A[bestIdx];
  const latest=A[A.length-1];
  const avg=sum(scores)/A.length;

  let o=`<div class="card"><div class="cards">
    <div class="k"><div class="l">Total Tests Attempted</div><b>${A.length}</b></div>
    <div class="k"><div class="l">Best Score 🏆</div><b class="c">${scores[bestIdx]}</b><span class="s">${esc(tname(best))}</span></div>
    <div class="k"><div class="l">Average Score</div><b>${r2(avg)}</b></div>
    <div class="k"><div class="l">Latest Score</div><b>${score(latest)}</b><span class="s">${when(latest)}</span></div>
  </div></div>`;

  o+=bmHTML();
  o+=cmpHTML(S,scores);

  o+='<h2>All Attempts (Latest first)</h2>';

  for(let n=A.length-1;n>=0;n--){
    const a=A[n], st=S[n], isBest=(n===bestIdx);
    o+=`<div class="card${isBest?' best':''}">
      <div class="head">
        <div>
          <div class="nm">Attempt #${n+1} – ${esc(tname(a))}${isBest?'<span class="badge">🏆 Best</span>':''}</div>
          <div class="dt">Submitted: ${when(a)}</div>
        </div>
        <div>
          <a class="btn p" href="result.html#${encodeURIComponent(a.id)}">Full Analysis</a>
          <button class="btn g" onclick="openRe(${n})">🔄 Re-attempt</button>
        </div>
      </div>
      <div class="chips">
        <div class="chip"><span>Score</span><b>${score(a)}</b></div>
        <div class="chip"><span>Accuracy</span><b>${st.acc.toFixed(1)}%</b></div>
        <div class="chip"><span>Correct</span><b class="c">${st.c}</b></div>
        <div class="chip"><span>Wrong</span><b class="w">${st.w}</b></div>
        <div class="chip"><span>Unattempted</span><b class="u">${st.u}</b></div>
        <div class="chip"><span>Total Time</span><b>${fmt(st.tot)}</b></div>
        ${(()=>{const pv=prevIdx(n);return pv<0?'':`<div class="chip"><span>vs Previous (Attempt ${A.filter((x,q)=>q<=pv&&tname(x)===tname(a)).length})</span><b>${delta(scores[n]-scores[pv])}</b></div>`})()}
      </div>
      <details open><summary>Section-wise Time &amp; Analysis</summary>
      <table><tr><th>Section</th><th>Score</th><th>Accuracy</th><th>Correct</th><th>Wrong</th><th>Unattempted</th><th>Correct Q. Time</th><th>Wrong Q. Time</th><th>Total Time</th></tr>`;
    a.sections.forEach((s,i)=>{
      const p=st.parts[i];
      o+=`<tr>
        <td><b>${esc(s.name||('Section '+(i+1)))}</b></td>
        <td>${p.net}</td>
        <td>${p.acc.toFixed(1)}%</td>
        <td class="c">${p.c}</td>
        <td class="w">${p.w}</td>
        <td class="u">${p.u}</td>
        <td>${fmt(p.cT)}</td>
        <td>${fmt(p.wT)}</td>
        <td><b>${fmt(p.tot)}</b></td>
      </tr>`;
    });
    o+='</table></details></div>';
  }
  root.innerHTML=o;
}

let reN=-1;
function openRe(n){
  reN=n;
  const name=tname(A[n]);
  const hist=A.filter(a=>tname(a)===name);
  $('reInfo').innerHTML='<b>'+esc(name)+'</b><br>'+hist.map((a,k)=>`Attempt ${k+1}: <b>${score(a)}</b> <span style="color:#666">(${when(a)})</span>`).join('<br>');
  $('reModal').style.display='flex';
}
function closeRe(){$('reModal').style.display='none'}
function goRe(){window.location.href='index.html'+((A[reN]&&A[reN].launch)||'')}

render();
</script>
</body></html>
